name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, sqlite3, pdo_sqlite, mbstring, openssl, curl, fileinfo, dom
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      # NativePHP's post-update-cmd runs native:install, which downloads the
      # Electron toolchain. CI only needs to lint, test, and build assets, so
      # scripts stay off here.
      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Generate autoload files
        run: composer dump-autoload --no-interaction

      - name: Prepare environment
        run: |
          cp .env.example .env
          php -r "file_exists('database/database.sqlite') || touch('database/database.sqlite');"
          php artisan key:generate

      - name: Lint (Pint)
        run: vendor/bin/pint --test

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run tests
        run: php artisan test

      - name: Install JS dependencies
        run: npm ci --ignore-scripts

      - name: Build assets
        run: npm run build
